name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-lint:
    name: Code Quality, Migrations & Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: smart_basket_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/smart_basket_test
      ASYNC_DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/smart_basket_test
      ENVIRONMENT: testing
      PYTHONPATH: .

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run Ruff Linter
        run: |
          python -m ruff check .

      - name: Run Black Formatter Check
        run: |
          python -m black --check .

      - name: Apply Database Migrations (Alembic)
        run: |
          alembic upgrade head

      - name: Validate Catalog Seeding & Multi-Store Pricing
        run: |
          python scripts/seed.py --verify

      - name: Execute Pytest Suite
        run: |
          python -m pytest -v

      - name: Set up Node.js 22 for Mobile (Expo SDK 58)
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: mobile/package-lock.json

      - name: Install Mobile Dependencies
        working-directory: mobile
        run: |
          npm ci --legacy-peer-deps

      - name: Run Mobile TypeScript Typecheck
        working-directory: mobile
        run: |
          npm run typecheck

      - name: Run Mobile ESLint Check
        working-directory: mobile
        run: |
          npm run lint
