    and packaging metadata.
- name: prices
  description: Active store-level product pricing, promotional discounts, and branch-level
    inventory status.
- name: history
  description: Chronological price observation timeseries across configurable date
    windows for inflation and price trend charting.
- name: intelligence
  description: Analytical trend intelligence, inflation metrics, and promotional deal
    veracity scoring.
- name: stores
  description: Supermarket chains, retail brands, and physical branch locations.
- name: baskets
  description: Multi-store basket total calculations and Smart Mode split optimization
    engine.
- name: auth
  description: User registration, authentication, and JWT profile access.
- name: homes
  description: Collaborative household spaces, pantry sharing, and role-based memberships.
- name: health
  description: Service liveness and readiness monitoring endpoints.
