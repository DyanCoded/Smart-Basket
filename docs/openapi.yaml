                  type: string
                type: object
                title: Response Health Check Health Get
              example:
                status: ok
                app: Smart Basket API
        '500':
          description: Internal server error occurred.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
