openapi: 3.1.0
info:
  title: Smart Basket API
  summary: Real-time grocery price intelligence and basket optimization engine
  description: "\n# Smart Basket API \U0001F6D2\n\nWelcome to the **Smart Basket API**,\
    \ an automated price intelligence\nand multi-store basket optimization platform\
    \ designed to eliminate\nthe manual effort of hunting across multiple supermarket\
    \ chains for\nthe best grocery prices.\n\n---\n\n## \U0001F680 Key Capabilities\n\
    \n1. **Catalog Search & Discovery (`/api/v1/products`)**\n   - Search products\
    \ by name, brand, barcode, or category with pagination.\n   - Access packaging\
    \ unit sizes (e.g. 2L, 500g, 1kg) and barcodes.\n\n2. **Store-Level Pricing (`/api/v1/products/{id}/prices`)**\n\
    \   - Compare active retail prices and stock availability across major\n     supermarket\
    \ chains (Checkers, Woolworths, Pick n Pay, SPAR, Shoprite).\n\n3. **Smart Basket\
    \ Optimizer (`/api/v1/baskets/calculate`)**\n   - **Single-Store Ranking:** Ranks\
    \ supermarket branches by total basket\n     cost (lowest first).\n   - **Smart\
    \ Split Optimization:** Recommends optimal 2-store splits\n     that yield maximum\
    \ savings.\n   - **Inventory Alerts:** Flags missing or out-of-stock items per\
    \ store branch.\n\n4. **Price History & Trend Intelligence (`/api/v1/products/{id}/history`)**\n\
    \   - Chronological timeseries price data across configurable date ranges.\n \
    \  - Inflation metrics, all-time high/low tracking, and promotional\n     discount\
    \ veracity scoring.\n\n---\n\n## \U0001F4D6 Interactive Documentation & Specs\n\
    - **Swagger UI:** Accessible at `/docs` (alias `/api/docs`)\n- **ReDoc:** Accessible\
    \ at `/redoc` (alias `/api/redoc`)\n- **OpenAPI 3.1 JSON Spec:** Available at\
    \ `/openapi.json`\n- **OpenAPI 3.1 YAML Spec:** Available at `/openapi.yaml`\n\
    - **Postman Collection:** Ready-to-import collection at `docs/postman_collection.json`\n"
  contact:
    name: Smart Basket Engineering Team
    url: https://github.com/DyanCoded/Smart-Basket
  license:
    name: MIT License
    url: https://opensource.org/licenses/MIT
  version: 0.1.0
paths:
  /api/v1/auth/register:
    post:
      tags:
      - auth
      summary: Register a new user account
      description: Create a new user with username, unique email, and hashed password.
      operationId: register_api_v1_auth_register_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserRegisterRequest'
        required: true
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '200':
          description: User account created successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '400':
          description: Bad Request - invalid query parameters or logical error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Unprocessable Content - validation error in parameters or payload.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error occurred.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/auth/login:
    post:
      tags:
      - auth
      summary: Authenticate user and obtain JWT token
      description: Authenticate using username or email along with password. Accepts
        either JSON payload or OAuth2 form data.
      operationId: login_api_v1_auth_login_post
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        '401':
          description: Unauthorized - invalid or expired credentials/token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Unprocessable Content - validation error in parameters or payload.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error occurred.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/auth/me:
    get:
      tags:
      - auth
      summary: Get current user profile & memberships
      description: Retrieve the authenticated user identity and all active household
        memberships.
      operationId: get_me_api_v1_auth_me_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfileResponse'
        '401':
          description: Unauthorized - invalid or expired credentials/token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error occurred.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
      - OAuth2PasswordBearer: []
  /api/v1/homes:
    get:
      tags:
      - homes
      summary: List caller's households
      description: Retrieve all households in which the authenticated user is a member.
      operationId: list_homes_api_v1_homes_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/HomeResponse'
                type: array
                title: Response List Homes Api V1 Homes Get
        '401':
          description: Unauthorized - invalid or expired credentials/token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error occurred.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
      - OAuth2PasswordBearer: []
    post:
      tags:
      - homes
      summary: Create a new household
      description: Create a household space and automatically assign the creator as
        the initial 'buyer'.
      operationId: create_home_api_v1_homes_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/HomeCreateRequest'
        required: true
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HomeDetailResponse'
        '200':
          description: Household created successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HomeDetailResponse'
        '400':
          description: Bad Request - invalid query parameters or logical error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized - invalid or expired credentials/token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Unprocessable Content - validation error in parameters or payload.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error occurred.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
      - OAuth2PasswordBearer: []
  /api/v1/homes/{home_id}:
    get:
      tags:
      - homes
      summary: Get household details and member roster
      description: Retrieve household details including full roster of buyers and
        consumers.
      operationId: get_home_detail_api_v1_homes__home_id__get
      security:
      - OAuth2PasswordBearer: []
      parameters:
      - name: home_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Home Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HomeDetailResponse'
        '401':
          description: Unauthorized - invalid or expired credentials/token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden - access denied for this household resource.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Not Found - requested resource does not exist.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error occurred.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/homes/{home_id}/members:
    post:
      tags:
      - homes
      summary: Invite/add a member to household
      description: Add a user to a household with 'buyer' or 'consumer' role. Requires
        caller to hold 'buyer' role.
      operationId: add_home_member_api_v1_homes__home_id__members_post
      security:
      - OAuth2PasswordBearer: []
      parameters:
      - name: home_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Home Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddMemberRequest'
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HomeMemberResponse'
        '200':
          description: Member added to household successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HomeMemberResponse'
        '400':
          description: Bad Request - invalid query parameters or logical error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized - invalid or expired credentials/token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden - access denied for this household resource.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Not Found - requested resource does not exist.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Unprocessable Content - validation error in parameters or payload.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error occurred.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    delete:
      tags:
      - homes
      summary: Remove a member from household via query parameter
      description: Remove a user from household using user_id query parameter.
      operationId: remove_home_member_query_api_v1_homes__home_id__members_delete
      security:
      - OAuth2PasswordBearer: []
      parameters:
      - name: home_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Home Id
      - name: user_id
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            format: uuid
          - type: 'null'
          description: User ID to remove
          title: User Id
        description: User ID to remove
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                additionalProperties:
                  type: string
                title: Response Remove Home Member Query Api V1 Homes  Home Id  Members
                  Delete
        '400':
          description: Bad Request - invalid query parameters or logical error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized - invalid or expired credentials/token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden - access denied for this household resource.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Not Found - requested resource does not exist.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error occurred.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/homes/{home_id}/members/{user_id}:
    delete:
      tags:
      - homes
      summary: Remove a member from household by user ID
      description: Remove a user from household. Buyers can remove anyone; members
        can remove themselves.
      operationId: remove_home_member_path_api_v1_homes__home_id__members__user_id__delete
      security:
      - OAuth2PasswordBearer: []
      parameters:
      - name: home_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Home Id
      - name: user_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: User Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                additionalProperties:
                  type: string
                title: Response Remove Home Member Path Api V1 Homes  Home Id  Members  User
                  Id  Delete
        '401':
          description: Unauthorized - invalid or expired credentials/token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden - access denied for this household resource.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Not Found - requested resource does not exist.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error occurred.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/products:
    get:
      tags:
      - products
      summary: Search and filter product catalog
      description: Search and filter grocery products by case-insensitive partial
        name, brand, barcode, or category UUID with offset-based pagination.
      operationId: list_products_api_v1_products_get
      parameters:
      - name: q
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Case-insensitive search term for name, brand, or barcode
          title: Q
        description: Case-insensitive search term for name, brand, or barcode
      - name: brand
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Filter by exact or partial brand name
          title: Brand
        description: Filter by exact or partial brand name
      - name: category_id
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            format: uuid
          - type: 'null'
          description: Filter by category UUID
          title: Category Id
        description: Filter by category UUID
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          maximum: 100
          minimum: 1
          description: Maximum number of items to return
          default: 20
          title: Limit
        description: Maximum number of items to return
      - name: offset
        in: query
        required: false
        schema:
          type: integer
          minimum: 0
          description: Number of items to skip for pagination
          default: 0
          title: Offset
        description: Number of items to skip for pagination
      responses:
        '200':
          description: Paginated list of catalog products.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductListResponse'
        '500':
          description: Internal server error occurred.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '400':
          description: Invalid query parameters.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Validation error in pagination parameters.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/products/{product_id}:
    get:
      tags:
      - products
      summary: Get product details
      description: Retrieve detailed product metadata including barcode, packaging
        unit size, unit type, and associated category information.
      operationId: get_product_api_v1_products__product_id__get
      parameters:
      - name: product_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Product Id
      responses:
        '200':
          description: Product metadata retrieved successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductResponse'
        '500':
          description: Internal server error occurred.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Product with specified id not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Invalid UUID format in path parameter.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/products/{product_id}/prices:
    get:
      tags:
      - products
      summary: Get store pricing for product
      description: List active prices, promotional discounts, and inventory stock
        status across all monitored supermarket chains and store branches.
      operationId: get_product_prices_api_v1_products__product_id__prices_get
      parameters:
      - name: product_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Product Id
      responses:
        '200':
          description: Active prices and stock status across all stores.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductPricesResponse'
        '500':
          description: Internal server error occurred.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Product with specified id not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Invalid UUID format in path parameter.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/products/{product_id}/history:
    get:
      tags:
      - products
      summary: Retrieve price timeseries history
      description: Fetch timestamped price entries for a product across configurable
        time windows and store locations, sorted chronologically for charting.
      operationId: get_product_price_history_api_v1_products__product_id__history_get
      parameters:
      - name: product_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Product Id
      - name: store_id
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            format: uuid
          - type: 'null'
          description: Filter timeseries by store UUID
          title: Store Id
        description: Filter timeseries by store UUID
      - name: start_date
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          description: Beginning of historical window (ISO-8601)
          title: Start Date
        description: Beginning of historical window (ISO-8601)
      - name: end_date
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          description: End of historical window (ISO-8601)
          title: End Date
        description: End of historical window (ISO-8601)
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          maximum: 500
          minimum: 1
          description: Max history points to return
          default: 100
          title: Limit
        description: Max history points to return
      - name: offset
        in: query
        required: false
        schema:
          type: integer
          minimum: 0
          description: History points offset
          default: 0
          title: Offset
        description: History points offset
      responses:
        '200':
          description: Chronological price observations returned.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductPriceHistoryResponse'
        '500':
          description: Internal server error occurred.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '400':
          description: Invalid date range parameters (start_date > end_date).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Product or store with specified id not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Validation error in query parameters or date formats.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/products/{product_id}/intelligence:
    get:
      tags:
      - products
      summary: Get price trend intelligence and deal indicator
      description: Compute all-time high/low, current vs historical average prices,
        percentage change, trend direction (INCREASING/DECREASING/STABLE), and promotional
        discount veracity scoring (0-100 rating).
      operationId: get_product_intelligence_api_v1_products__product_id__intelligence_get
      parameters:
      - name: product_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Product Id
      - name: store_id
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            format: uuid
          - type: 'null'
          description: Calculate metrics for a specific store location
          title: Store Id
        description: Calculate metrics for a specific store location
      responses:
        '200':
          description: Analytical intelligence and deal veracity score computed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PriceIntelligenceResponse'
        '500':
          description: Internal server error occurred.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Product or store with specified id not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Invalid UUID format in path or query parameter.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/stores:
    get:
      tags:
      - stores
      summary: List supermarket chains and store branches
      description: Retrieve supermarket branches with parent retailer relationship,
        address details, and active monitoring status. Supports filtering by retailer
        chain UUID, active status, and search query.
      operationId: list_stores_api_v1_stores_get
      parameters:
      - name: retailer_id
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            format: uuid
          - type: 'null'
          description: Filter stores by parent retailer UUID
          title: Retailer Id
        description: Filter stores by parent retailer UUID
      - name: is_active
        in: query
        required: false
        schema:
          anyOf:
          - type: boolean
          - type: 'null'
          description: Filter by active status
          title: Is Active
        description: Filter by active status
      - name: q
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Search term for store name, branch code, or address
          title: Q
        description: Search term for store name, branch code, or address
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          maximum: 100
          minimum: 1
          description: Maximum number of stores to return
          default: 50
          title: Limit
        description: Maximum number of stores to return
      - name: offset
        in: query
        required: false
        schema:
          type: integer
          minimum: 0
          description: Number of stores to skip for pagination
          default: 0
          title: Offset
        description: Number of stores to skip for pagination
      responses:
        '200':
          description: Paginated list of matching store branches.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StoreListResponse'
        '500':
          description: Internal server error occurred.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '400':
          description: Invalid query parameters.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Validation error in pagination or query parameters.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/baskets/calculate:
    post:
      tags:
      - baskets
      summary: Calculate multi-store basket prices and smart split optimization
      description: Evaluates a grocery shopping basket across all monitored supermarket
        stores. Returns a deterministic price ranking of single-store totals (cheapest
        first), missing item alerts, and the optimal 2-store split (Smart Mode) that
        maximizes consumer savings.
      operationId: calculate_basket_api_v1_baskets_calculate_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BasketCalculationRequest'
            examples:
              two_item_basket:
                summary: Standard 2-item basket (Milk & Bread)
                description: Regular shopping run comparing prices for Clover Milk
                  2L and Albany White Bread.
                value:
                  items:
                  - product_id: 6e2941e3-033d-5768-8143-5e7ebc24b874
                    quantity: 2.0
                  - product_id: ab9928f5-221a-5546-8b6c-c4ec04fbe933
                    quantity: 1.0
              family_pantry_basket:
                summary: Pantry staples basket (Milk, Bread & Eggs)
                description: Larger shopping basket evaluating single-store totals
                  and split savings for Milk, Bread, and 18pk Eggs.
                value:
                  items:
                  - product_id: 6e2941e3-033d-5768-8143-5e7ebc24b874
                    quantity: 2.0
                  - product_id: ab9928f5-221a-5546-8b6c-c4ec04fbe933
                    quantity: 1.0
                  - product_id: 4ca9f9c4-dea2-5f16-8ffb-4ec70ea08382
                    quantity: 1.0
        required: true
      responses:
        '200':
          description: Multi-store basket totals and optimal split calculated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BasketCalculationResponse'
        '500':
          description: Internal server error occurred.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '400':
          description: Invalid basket calculation request or constraints.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: One or more requested product IDs not found in catalog.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Validation error in basket request schema or quantities.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /health:
    get:
      tags:
      - health
      summary: Service health check
      description: Verify API service liveness and operational status.
      operationId: health_check_health_get
      responses:
        '200':
          description: Service is healthy and responding.
          content:
            application/json:
              schema:
